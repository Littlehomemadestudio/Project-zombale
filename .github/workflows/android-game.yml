name: Android game build

on:
  push:
    branches:
      - flat-zombie-android
    paths:
      - "android-game/**"
      - ".github/workflows/android-game.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM tests
        run: gradle -p android-game testDebugUnitTest

      - name: Assemble debug APK
        run: gradle -p android-game assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: dead-signal-debug-apk
          path: android-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
